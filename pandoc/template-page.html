<!doctype html>
<html lang="$lang$">
    <head>
$head.html()$
    </head>
    <body>
        <div id="layout" class="pure-g">
            <div class="sidebar pure-u-1 pure-u-md-1-3">
                <div class="centered">
                    <a href="$root$"><img class="portrait" src="$root$images/me.jpeg" alt="Gabriela Moreira" /></a>
                    <h2 class="brand-title">Gabriela Moreira</h2>
                    <h2 class="brand-tagline">Formal methods &amp; programming languages research engineer</h2>

                    <nav class="nav">
                        <ul class="nav-list">
                            <li class="nav-item">
                                <a class="pure-button" href="https://twitter.com/bugarela"><i class="fab fa-twitter big-icon"></i></a>

                            <li class="nav-item">
                                <a class="button" href="https://github.com/bugarela"><i class="fab fa-github big-icon"></i>@bugarela</a>

                            <li class="nav-item">

                            </li>
                        </ul>
                        <ul class="nav-list">
                            <li class="nav-item">
                                <a class="button" href="https://bugarela.com/mfo"><i class="fas fa-folder"></i> MFO</a>
                            </li>
                        </ul>
                    </nav>

                    <div class="footer">
                        <div>Built with pandoc.</div>
                    </div>
                </div>
            </div>
            <div class="content pure-u-1 pure-u-md-2-3">
$if(title)$

$endif$
$body$
