<!doctype html>
<html lang="$lang$">
    <head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="$description$">
<title>$title$</title>
<link rel="icon" href="/images/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<meta property="og:url" content="$site-url$$input-url$" />
<meta property="og:title" content="$title$" />
<meta property="og:type" content="website" />
<meta property="og:description" content="$description$" />
$if(twitter)$
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@$twitter$">
<meta name="twitter:title" content="$title$">
<meta name="twitter:description" content="$description$">
$endif$
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="$root$css/layouts/site.css?v=$cssv$">
<link rel="stylesheet" href="$root$css/layouts/story.css?v=$cssv$">
    </head>
    <body class="chrome story">
$nav.html()$
        <div class="site">
            <main class="wrap">
$body$
            </main>
$footer.html()$
        </div>
    </body>
</html>
